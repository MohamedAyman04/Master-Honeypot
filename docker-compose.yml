services:
  # ── Shared State Store (Redis) ────────────────────────────────────────────────
  redis:
    image: redis:latest
    container_name: ics_state_store
    networks:
      - ot-net
    restart: always

  # ── Physical Process Simulator (Purdue Level 0/1 Simulation) ──────────────────
  physics_simulator:
    build:
      context: .
      dockerfile: plc/Dockerfile
    container_name: ics_physics_engine
    command: python /app/physics/physics_process.py
    networks:
      - ot-net
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
    env_file: .env
    volumes:
      - ./physics:/app/physics:ro
    depends_on:
      - redis
    restart: unless-stopped

  # ── Modbus PLC Simulator (Purdue Level 2 - Exposed via DMZ) ───────────────────
  plc_simulator:
    build:
      context: .
      dockerfile: plc/Dockerfile
    container_name: plc_simulator
    command: python /app/plc/modbus_server.py
    ports:
      - "502:502"
    networks:
      - dmz-net
      - ot-net
      - monitor-net
    env_file: .env
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - INFLUX_URL=${INFLUX_URL}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
    depends_on:
      - redis
      - physics_simulator
      - historian
    restart: unless-stopped

  # ── S7comm PLC Honeypot (Siemens S7-300 emulation) ───────────────────────────
  ics_s7_plc:
    build:
      context: .
      dockerfile: plc/Dockerfile
    container_name: ics_s7_plc
    command: python /app/plc/s7_server.py
    networks:
      - dmz-net
      - ot-net
      - monitor-net
    ports:
      - "102:102"
    volumes:
      - shared-data:/data
    env_file: .env
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - INFLUX_URL=${INFLUX_URL}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
    depends_on:
      - redis
      - physics_simulator
    restart: always

  # ── Deception Fake PLC (Dead-end Modbus device) ──────────────────────────────
  fake_plc_sim:
    build:
      context: ./fake_plc
    container_name: fake_plc_sim
    networks:
      - dmz-net
      - ot-net
    ports:
      - "503:502"
    restart: unless-stopped

  # ── DNP3 Honeypot (power/water utility protocol) ─────────────────────────────
  ics_dnp3:
    build:
      context: .
      dockerfile: plc/Dockerfile
    container_name: ics_dnp3
    command: python /app/plc/dnp3_server.py
    networks:
      - dmz-net
      - monitor-net
    ports:
      - "20000:20000"
    env_file: .env
    environment:
      - INFLUX_URL=${INFLUX_URL}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
    depends_on:
      - historian
    restart: unless-stopped

  # ── SCADA SSH Workstation (Purdue Level 2 — Lateral Movement Pivot) ───────────
  # Exposes:
  #   :2222  — SSH service (lateral-movement target; engineer/operator accounts)
  #   :5100  — Physics REST API (unauthenticated; cross-layer data bridge to L3)
  ics_scada_ssh:
    build:
      context: . # Level 2 root — gives access to physics/ package
      dockerfile: scada_ssh/Dockerfile # explicit path because context is now the parent
    container_name: ics_scada_ssh
    depends_on:
      - story_logger
    networks:
      ot-net: {}
      dmz-net: {}
      enterprise-net:
        ipv4_address: 192.168.50.10 # static IP — referenced by L3 OPC-UA bridge
      l2l3-bridge-net:
        ipv4_address: 172.28.0.10 # shared bridge to Level 3 stack
    cap_add:
      - NET_ADMIN
    ports:
      - "2222:2222" # SSH
      - "5100:5100" # Physics REST API (Level 2 → Level 3 data flow)
    env_file: .env
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - PHYSICS_API_PORT=5100
      - LOG_DIR=/var/log/honeynet
      - L2L3_SHARED_TOKEN=${L2L3_SHARED_TOKEN:-change-this-token}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
      - INFLUX_URL=${INFLUX_URL}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - STORY_LOGGER_URL=http://story_logger:8600
    volumes:
      - unified-logs:/var/log/honeynet # unified log volume shared across services
    restart: unless-stopped

  # ── HMI Web Dashboard (Purdue Level 2) ────────────────────────────────────────
  hmi:
    build:
      context: ./hmi
    container_name: ics_hmi
    depends_on:
      plc_simulator:
        condition: service_started
    networks:
      - ot-net
      - monitor-net
    ports:
      - "8060:8060"
    env_file: .env
    environment:
      - PLC_IP=${PLC_IP}
      - REDIS_HOST=${REDIS_HOST}
      - INFLUX_URL=${INFLUX_URL}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
    restart: unless-stopped
    volumes:
      - ./hmi:/app:ro
    command: python hmi_app.py

  # ── Historian Bridge (Modbus → InfluxDB) ─────────────────────────────────────
  historian_bridge:
    build:
      context: ./hmi
    container_name: ics_historian_bridge
    command: python hmi_simulator.py
    volumes:
      - ./hmi:/app:ro
    depends_on:
      plc_simulator:
        condition: service_started
      historian:
        condition: service_started
    networks:
      - dmz-net
      - ot-net
      - monitor-net
    env_file: .env
    environment:
      - PLC_IP=${PLC_IP}
      - INFLUX_URL=${INFLUX_URL}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
    restart: unless-stopped

  # ── Hardware Bridge (Raspberry Pi 4B → InfluxDB / Redis) ────────────────────
  rpi_bridge:
    image: master-honeypot-hmi:latest
    container_name: ics_rpi_bridge
    command: python -u /app/scripts/raspberry_pi_bridge.py
    volumes:
      - ./scripts:/app/scripts:ro
    depends_on:
      - historian
      - redis
    networks:
      - ot-net
      - monitor-net
    env_file: .env
    environment:
      - RPI_HOST=${RPI_HOST:-172.20.10.8,192.168.1.8}
      - REDIS_HOST=redis
      - INFLUX_URL=http://historian:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  # ── ML Anomaly Detection Engine (Purdue Level 2 - Isolated Monitoring) ────────
  ml_engine:
    build:
      context: ./ml-engine
    container_name: ics_ml_engine
    volumes:
      - shared-data:/data # model files persisted here
      - ./shared:/app/shared:ro # MITRE mapping table
    depends_on:
      historian:
        condition: service_started
    networks:
      - monitor-net
    ports:
      - "8001:8000"
    env_file: .env
    environment:
      - INFLUX_URL=${INFLUX_URL}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
      - STORY_LOGGER_URL=http://story_logger:8600
      - STORY_RUN_ID=${STORY_RUN_ID}
    restart: unless-stopped

  # ── Historian API (Purdue Level 3 Integration Bridge) ─────────────────────────
  historian_api:
    build:
      context: ./historian_api
    container_name: ics_historian_api
    depends_on:
      - historian
      - ml_engine
      - ics_scada_ssh
    networks:
      - monitor-net
      - enterprise-net
    ports:
      - "5001:5000"
    env_file: .env
    environment:
      - INFLUX_URL=${INFLUX_URL}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - ML_ENGINE_URL=${ML_ENGINE_URL}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
      - SCADA_SSH_HOST=${SCADA_SSH_HOST}
      - SCADA_SSH_PORT=${SCADA_SSH_PORT}
      - SCADA_SSH_USER=${SCADA_SSH_USER}
      - SCADA_SSH_PASS=${SCADA_SSH_PASS}
    restart: unless-stopped

  # ── Purdue Level 3 — Enterprise Workstations & Decoys ─────────────────────────
  workstation_eng_01:
    image: master-honeypot-workstation-1:latest
    container_name: ws_eng_01
    hostname: ws-eng-01
    mac_address: "02:42:c0:a8:32:15"
    ports:
      - "5021:5001"
    environment:
      - WORKSTATION_COMPONENT=workstation_1
      - WORKSTATION_DB_NAME=workstation_1.db
      - WORKSTATION_DEVICE_IP=192.168.50.21
      - WORKSTATION_DEVICE_MAC=02:42:c0:a8:32:15
      - WORKSTATION_SERIAL=FAC-ENG-2401
      - WORKSTATION_MODEL=Siemens IPC477E Industrial PC
      - WORKSTATION_VENDOR=Siemens
      - LEVEL2_PHYSICS_URL=http://192.168.50.10:5100
      - LEVEL2_HISTORIAN_URL=http://historian_api:5000
      - STORY_LOGGER_URL=http://story_logger:8600
      - STORY_RUN_ID=${STORY_RUN_ID}
    networks:
      enterprise-net:
        ipv4_address: 192.168.50.21
    depends_on:
      - story_logger
      - ics_scada_ssh
    restart: unless-stopped

  workstation_eng_02:
    image: master-honeypot-workstation-2:latest
    container_name: ws_eng_02
    hostname: ws-eng-safety-02
    mac_address: "02:42:c0:a8:32:16"
    ports:
      - "5022:5001"
    environment:
      - WORKSTATION_COMPONENT=workstation_2
      - WORKSTATION_DB_NAME=workstation_2.db
      - WORKSTATION_DEVICE_IP=192.168.50.22
      - WORKSTATION_DEVICE_MAC=02:42:c0:a8:32:16
      - WORKSTATION_SERIAL=FAC-ENG-2402
      - WORKSTATION_MODEL=Siemens IPC677E High-End Engineering PC
      - WORKSTATION_VENDOR=Siemens
      - LEVEL2_PHYSICS_URL=http://192.168.50.10:5100
      - LEVEL2_HISTORIAN_URL=http://historian_api:5000
      - STORY_LOGGER_URL=http://story_logger:8600
      - STORY_RUN_ID=${STORY_RUN_ID}
    networks:
      enterprise-net:
        ipv4_address: 192.168.50.22
    depends_on:
      - story_logger
      - ics_scada_ssh
    restart: unless-stopped

  workstation_ops_01:
    image: master-honeypot-workstation-3:latest
    container_name: ws_ops_01
    hostname: ws-scada-ops-01
    mac_address: "02:42:c0:a8:32:1f"
    ports:
      - "5023:5001"
    environment:
      - WORKSTATION_COMPONENT=workstation_3
      - WORKSTATION_DB_NAME=workstation_3.db
      - WORKSTATION_DEVICE_IP=192.168.50.31
      - WORKSTATION_DEVICE_MAC=02:42:c0:a8:32:1f
      - WORKSTATION_SERIAL=FAC-OPS-3101
      - WORKSTATION_MODEL=Rockwell Automation ASEM 6300B Industrial PC
      - WORKSTATION_VENDOR=Rockwell Automation
      - LEVEL2_PHYSICS_URL=http://192.168.50.10:5100
      - LEVEL2_HISTORIAN_URL=http://historian_api:5000
      - STORY_LOGGER_URL=http://story_logger:8600
      - STORY_RUN_ID=${STORY_RUN_ID}
    networks:
      enterprise-net:
        ipv4_address: 192.168.50.31
    depends_on:
      - story_logger
      - ics_scada_ssh
    restart: unless-stopped

  workstation_ops_02:
    image: master-honeypot-workstation-4:latest
    container_name: ws_ops_02
    hostname: ws-scada-ops-02
    mac_address: "02:42:c0:a8:32:20"
    ports:
      - "5024:5001"
    environment:
      - WORKSTATION_COMPONENT=workstation_4
      - WORKSTATION_DB_NAME=workstation_4.db
      - WORKSTATION_DEVICE_IP=192.168.50.32
      - WORKSTATION_DEVICE_MAC=02:42:c0:a8:32:20
      - WORKSTATION_SERIAL=FAC-OPS-3102
      - WORKSTATION_MODEL=Advantech UNO-2484G Industrial Box PC
      - WORKSTATION_VENDOR=Advantech
      - LEVEL2_PHYSICS_URL=http://192.168.50.10:5100
      - LEVEL2_HISTORIAN_URL=http://historian_api:5000
      - STORY_LOGGER_URL=http://story_logger:8600
      - STORY_RUN_ID=${STORY_RUN_ID}
    networks:
      enterprise-net:
        ipv4_address: 192.168.50.32
    depends_on:
      - story_logger
      - ics_scada_ssh
    restart: unless-stopped

  workstation_maint_01:
    image: master-honeypot-workstation-5:latest
    container_name: ws_maint_01
    hostname: ws-field-maint-01
    mac_address: "02:42:c0:a8:32:29"
    ports:
      - "5025:5001"
    environment:
      - WORKSTATION_COMPONENT=workstation_5
      - WORKSTATION_DB_NAME=workstation_5.db
      - WORKSTATION_DEVICE_IP=192.168.50.41
      - WORKSTATION_DEVICE_MAC=02:42:c0:a8:32:29
      - WORKSTATION_SERIAL=FAC-MNT-4101
      - WORKSTATION_MODEL=Panasonic Toughbook CF-33 Field Maintenance Laptop
      - WORKSTATION_VENDOR=Panasonic Industrial
      - LEVEL2_PHYSICS_URL=http://192.168.50.10:5100
      - LEVEL2_HISTORIAN_URL=http://historian_api:5000
      - STORY_LOGGER_URL=http://story_logger:8600
      - STORY_RUN_ID=${STORY_RUN_ID}
    networks:
      enterprise-net:
        ipv4_address: 192.168.50.41
    depends_on:
      - story_logger
      - ics_scada_ssh
    restart: unless-stopped

  # ── Purdue Level 3 — Industrial OPC-UA & Enterprise Historian ────────────────
  opcua_l3:
    image: master-honeypot-opcua:latest
    container_name: ics_opcua_l3
    ports:
      - "4841:4840"
    environment:
      - OPCUA_PUSH_SECONDS=15
      - OPCUA_METRICS_PORT=9108
      - PYTHONUNBUFFERED=1
      - LEVEL2_PULL_URL=http://192.168.50.10:5100/api/physics/metrics
      - LEVEL2_SHARED_TOKEN=${L2L3_SHARED_TOKEN:-change-this-token}
      - LEVEL2_TIMEOUT_SECONDS=3.0
    networks:
      enterprise-net:
        ipv4_address: 192.168.50.50
    depends_on:
      - ics_scada_ssh
    restart: unless-stopped

  historian_l3:
    image: master-honeypot-historian_l3:latest
    container_name: ics_historian_l3
    ports:
      - "5005:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:///database-files/historians/sensor_readings_historian.db
      - STORY_LOGGER_URL=http://story_logger:8600
      - STORY_RUN_ID=${STORY_RUN_ID}
    networks:
      enterprise-net:
        ipv4_address: 192.168.50.60
    depends_on:
      - story_logger
    restart: unless-stopped

  # ── Network Sniffer / Logger (Full Interface Capture) ────────────────────────
  network_sniffer:
    build:
      context: ./logger
    container_name: ics_sniffer
    command: python logger.py
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host
    volumes:
      - shared-data:/data
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}

  # ── Cross-Layer Correlator (Sniffer → InfluxDB) ───────────────────────────────
  correlator:
    build:
      context: ./logger
    container_name: ics_correlator
    depends_on:
      - plc_simulator
      - historian
    network_mode: service:plc_simulator
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./shared:/app/shared:ro # MITRE mapping table
    env_file: .env
    environment:
      - PLC_IP=127.0.0.1
      - INFLUX_URL=${INFLUX_URL}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
    restart: unless-stopped

  # ── InfluxDB Historian (Purdue Level 2/3 Data Store) ─────────────────────────
  historian:
    image: influxdb:2.7.6
    container_name: ics_historian
    ports:
      - "8086:8086"
    env_file: .env
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=${DOCKER_INFLUXDB_INIT_MODE}
      - DOCKER_INFLUXDB_INIT_USERNAME=${DOCKER_INFLUXDB_INIT_USERNAME}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${DOCKER_INFLUXDB_INIT_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}
      - DOCKER_INFLUXDB_INIT_ORG=${DOCKER_INFLUXDB_INIT_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${DOCKER_INFLUXDB_INIT_BUCKET}
    volumes:
      - influx-data:/var/lib/influxdb2
    networks:
      - monitor-net
      - ot-net
      - enterprise-net
    restart: unless-stopped

  # ── Grafana Image Renderer ─────────────────────────────────────────────────
  grafana-image-renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: ics_grafana_renderer
    networks:
      - monitor-net
    environment:
      - ENABLE_METRICS=true
      - RENDERING_MODE=default
      - RENDERING_CLUSTERING_MODE=context
      - RENDERING_CLUSTERING_MAX_CONCURRENCY=5
      - LOG_LEVEL=info
      - AUTH_TOKEN=${GF_RENDERING_AUTH_TOKEN}
    restart: unless-stopped

  # ── Grafana Dashboard (Visualization) ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: ics_grafana
    ports:
      - "3005:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./grafana_provisioning:/etc/grafana/provisioning
      - ./grafana_dashboards:/var/lib/grafana/dashboards
    env_file: .env
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=${GF_AUTH_ANONYMOUS_ORG_ROLE}
      - GF_RENDERING_SERVER_URL=${GF_RENDERING_SERVER_URL}
      - GF_RENDERING_CALLBACK_URL=${GF_RENDERING_CALLBACK_URL}
      - GF_LOG_FILTERS=${GF_LOG_FILTERS}
      - GF_RENDERING_RENDERER_TOKEN=${GF_RENDERING_RENDERER_TOKEN}
    depends_on:
      - historian
      - grafana-image-renderer
    networks:
      - monitor-net
    dns:
      - 127.0.0.11
    restart: unless-stopped

  # ── Attacker Node (Purdue Level 3.5 / External Threat Simulation) ─────────────
  attacker_node:
    build:
      context: ./attacker_node
    container_name: attacker_node
    networks:
      - dmz-net
      - monitor-net
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./results:/app/results # persists CSV results across container restarts
    env_file: .env
    environment:
      - INFLUX_URL=${INFLUX_URL}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
      - STORY_LOGGER_URL=http://story_logger:8600
      - STORY_RUN_ID=${STORY_RUN_ID}
    stdin_open: true
    tty: true
    restart: unless-stopped

  # ── Story Logger (cross-level narrative log) ───────────────────────────────
  story_logger:
    build:
      context: ./story_logger
      dockerfile: Dockerfile
    container_name: story_logger_l2
    ports:
      - "8600:8600"
    volumes:
      - .:/repo
    environment:
      - "STORY_LOG_PATH=/repo/logs/general logs.jsonl"
      - PYTHONUNBUFFERED=1
    networks:
      - dmz-net
      - monitor-net
      - l2l3-bridge-net
      - enterprise-net
      - sandbox-net
    restart: unless-stopped

  # ── Honeypot Historian API (DMZ-facing decoy) ─────────────────────────────────
  honeypot_historian_api:
    build:
      context: ./honeypot_historian_api
    container_name: honeypot_historian_api
    networks:
      - dmz-net
      - monitor-net
    ports:
      - "5002:5000"
    env_file: .env
    environment:
      - INFLUX_URL=${INFLUX_URL}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=${INFLUX_ORG}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
      - SCADA_SSH_HOST=${SCADA_SSH_HOST}
      - SCADA_SSH_PORT=${SCADA_SSH_PORT}
      - SCADA_SSH_USER=${HONEYPOT_SSH_USER}
      - SCADA_SSH_PASS=${HONEYPOT_SSH_PASS}
    depends_on:
      - historian
      - ics_scada_ssh
    restart: unless-stopped

  # ── Level 2 Log Dashboard (Streamlit — mirrors L3 :8501) ─────────────────────
  log_dashboard:
    build:
      context: ./log_dashboard
    container_name: ics_log_dashboard
    ports:
      - "8502:8501"
    volumes:
      - "./logs/general logs.jsonl:/data/general_logs.jsonl"
    networks:
      - monitor-net
    env_file: .env
    environment:
      - LOG_FILE_PATH=/data/general_logs.jsonl
      - PYTHONUNBUFFERED=1
    depends_on:
      - historian
    restart: unless-stopped

  # ── Purdue Level 3.5 — DMZ Secure OT Access Gateway & Dual-World Router ─────
  dmz_gateway:
    build:
      context: ./dmz_gateway
      dockerfile: Dockerfile
    container_name: dmz_gateway
    hostname: dmz-gateway-01
    ports:
      - "8088:8088"
      - "8443:8443"
    environment:
      - GATEWAY_PORT=8088
      - REAL_WORKSTATION_URL=http://ws_eng_01:5001
      - REAL_HISTORIAN_URL=http://historian_api:5000
      - DECOY_WORKSTATION_URL=http://ws_decoy_eng:5001
      - DECOY_HISTORIAN_URL=http://honeypot_historian_api:5000
      - STORY_LOGGER_URL=http://story_logger:8600
      - INFLUX_URL=http://historian:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN:-supersecrettoken}
      - INFLUX_ORG=${INFLUX_ORG:-my_refinery}
      - INFLUX_BUCKET=${INFLUX_BUCKET:-sensor_logs}
      - PYTHONUNBUFFERED=1
    networks:
      - dmz-net
      - enterprise-net
      - sandbox-net
      - monitor-net
    depends_on:
      - story_logger
      - historian
    restart: unless-stopped

  # ── Purdue Level 3.5 — Sandboxed Decoy Workstation (Honeypot Deception Zone) ──
  workstation_decoy_eng:
