<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Factor Authentication — Refinery OT Gateway</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090e17;
            --surface: #121c2b;
            --surface-accent: #19273c;
            --border: #23364f;
            --text-main: #f0f5fa;
            --text-muted: #859bb5;
            --primary: #0088cc;
            --accent: #00d2aa;
            --danger: #ff4757;
            --shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'IBM Plex Sans', -apple-system, sans-serif;
            background: radial-gradient(circle at 10% 20%, #101c30 0%, #090e17 90%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .mfa-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            width: 100%;
            max-width: 440px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .mfa-header {
            background: linear-gradient(135deg, #162438 0%, #0e1724 100%);
            border-bottom: 1px solid var(--border);
            padding: 24px 28px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .shield-icon {
            width: 40px;
            height: 40px;
            background: rgba(0, 210, 170, 0.15);
            border: 1px solid var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .mfa-title h1 {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
        }

        .mfa-title p {
            font-size: 0.78rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 2px;
        }

        .mfa-body {
            padding: 28px;
        }

        .user-pill {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: rgba(35, 54, 79, 0.4);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.85rem;
        }

        .user-pill span:first-child {
            color: var(--text-muted);
        }

        .user-pill span:last-child {
            font-weight: 600;
            color: #ffffff;
            font-family: 'JetBrains Mono', monospace;
        }

        .alert-box {
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 18px;
            background: rgba(255, 71, 87, 0.12);
            border: 1px solid var(--danger);
            color: #ff9f9f;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .otp-input {
            width: 100%;
            background: var(--surface-accent);
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 14px 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent);
            text-align: center;
            letter-spacing: 0.35em;
            transition: all 0.2s ease;
        }

        .otp-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(0, 210, 170, 0.2);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--accent) 0%, #00a383 100%);
            border: none;
            border-radius: 8px;
            padding: 13px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            color: #09121a;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #1fe5bc 0%, var(--accent) 100%);
            transform: translateY(-1px);
        }

        .token-helper {
            margin-top: 20px;
            padding: 12px;
            background: rgba(0, 136, 204, 0.1);
            border: 1px dashed var(--primary);
            border-radius: 8px;
            font-size: 0.8rem;
            color: #9cb4cf;
            text-align: center;
        }

        .token-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            margin: 4px 0;
            letter-spacing: 0.1em;
        }

        .btn-cancel {
            display: block;
            text-align: center;
            margin-top: 16px;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-decoration: none;
        }

        .btn-cancel:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="mfa-card">
        <div class="mfa-header">
            <div class="shield-icon">🔐</div>
            <div class="mfa-title">
                <h1>Security Challenge</h1>
                <p>Multi-Factor Authentication (MFA / OTP)</p>
            </div>
        </div>

        <div class="mfa-body">
            <div class="user-pill">
                <span>Authenticated Identity</span>
                <span>{{ session.get('temp_user', 'operator') }}</span>
            </div>

            {% if error %}
            <div class="alert-box">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/mfa">
                <div class="form-group">
                    <label for="otp_code">Enter 6-Digit One-Time Passcode</label>
                    <input type="text" id="otp_code" name="otp_code" class="otp-input" maxlength="6" pattern="[0-9]{6}" required autocomplete="one-time-code" autofocus placeholder="••••••">
                </div>

                <button type="submit" class="btn-submit">
                    <span>Validate Token & Enter Industrial Zone</span>
                    <span>→</span>
                </button>
            </form>

            <div class="token-helper">
                <span>Active TOTP Token (Expires in {{ remaining_sec }}s):</span>
                <div class="token-code">{{ current_otp }}</div>
                <small style="color: #7b94ad;">Test Master Bypass: <code>999888</code></small>
            </div>

            <a href="/logout" class="btn-cancel">← Return to Login</a>
        </div>
    </div>
</body>
</html>
