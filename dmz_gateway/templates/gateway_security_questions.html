<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARABCO — Security Verification</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #070c09;
            --surface: #0f1712;
            --surface-elevated: #14201a;
            --border-subtle: #1b2e24;
            --border-active: #2b4c3c;
            --text-heading: #f0fdf4;
            --text-body: #d1fae5;
            --text-muted: #7da392;
            --accent-brand: #059669;
            --accent-brand-hover: #10b981;
            --status-danger: #ef4444;
            --status-danger-bg: rgba(239, 68, 68, 0.1);
            --font-main: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-base);
            color: var(--text-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            -webkit-font-smoothing: antialiased;
        }

        .gateway-container {
            width: 100%;
            max-width: 440px;
        }

        .portal-card {
            background-color: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.55), 0 0 40px rgba(5, 150, 105, 0.08);
            overflow: hidden;
        }

        .portal-header {
            padding: 32px 32px 18px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: linear-gradient(135deg, #064e3b 0%, #047857 100%);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #ecfdf5;
            box-shadow: 0 4px 16px rgba(5, 150, 105, 0.25);
        }

        .brand-logo svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-title {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: var(--text-heading);
            text-transform: uppercase;
        }

        .portal-body {
            padding: 8px 32px 36px;
        }

        .info-prompt {
            font-size: 0.88rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .alert-error {
            background-color: var(--status-danger-bg);
            border: 1px solid var(--status-danger);
            color: #fca5a5;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            line-height: 1.4;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            background-color: #080d0a;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 11px 14px;
            font-family: var(--font-main);
            font-size: 0.92rem;
            color: var(--text-heading);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-brand);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.2);
            background-color: #0b130e;
        }

        .btn-authenticate {
            width: 100%;
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 8px;
            color: #ffffff;
            padding: 13px 16px;
            font-family: var(--font-main);
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: all 0.15s ease;
            margin-top: 8px;
            box-shadow: 0 4px 14px rgba(5, 150, 105, 0.25);
        }

        .btn-authenticate:hover {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35);
            transform: translateY(-1px);
        }

        .btn-authenticate:active {
            transform: translateY(0);
        }

        .nav-links {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 18px;
            font-size: 0.8rem;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .nav-links a:hover {
            color: #34d399;
        }
    </style>
</head>
<body>
    <div class="gateway-container">
        <div class="portal-card">
            <div class="portal-header">
                <div class="brand-logo">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                    </svg>
                </div>
                <h1 class="brand-title">ARABCO</h1>
            </div>

            <div class="portal-body">
                <div class="info-prompt">
                    Security Verification Questions
                </div>

                {% if error %}
                <div class="alert-error">
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST" action="/mfa/security-questions" autocomplete="off">
                    <div class="form-group">
                        <label for="dog_name" class="form-label">What is my dog's name?</label>
                        <input type="text" id="dog_name" name="dog_name" class="form-input" placeholder="Your answer" required autofocus>
                    </div>

                    <div class="form-group">
                        <label for="birth_place" class="form-label">Where was I born?</label>
                        <input type="text" id="birth_place" name="birth_place" class="form-input" placeholder="Your answer" required>
                    </div>

                    <div class="form-group">
                        <label for="siblings_count" class="form-label">How many siblings do I have?</label>
                        <input type="text" id="siblings_count" name="siblings_count" class="form-input" placeholder="Your answer" required>
                    </div>

                    <button type="submit" class="btn-authenticate">
                        Verify
                    </button>
                </form>

                <div class="nav-links">
                    <a href="/mfa">&larr; Back to Email Code</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
