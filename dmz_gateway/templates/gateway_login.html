<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Refining Corp — Secure OT Access Gateway</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0f16;
            --surface: #111822;
            --surface-elevated: #16212e;
            --border-subtle: #202e40;
            --border-active: #2f4561;
            --text-heading: #f1f5f9;
            --text-body: #cbd5e1;
            --text-muted: #788a9f;
            --accent-brand: #0284c7;
            --accent-brand-hover: #0369a1;
            --status-danger: #dc2626;
            --status-danger-bg: rgba(220, 38, 38, 0.08);
            --font-main: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-base);
            color: var(--text-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            -webkit-font-smoothing: antialiased;
        }

        .gateway-container {
            width: 100%;
            max-width: 460px;
        }

        .portal-card {
            background-color: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
            overflow: hidden;
        }

        .portal-header {
            background-color: var(--surface-elevated);
            border-bottom: 1px solid var(--border-subtle);
            padding: 24px 28px 20px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        .corp-emblem {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            border-radius: 6px;
            background: #0f172a;
            border: 1px solid var(--border-active);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-brand);
        }

        .corp-emblem svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .portal-header-titles {
            flex: 1;
        }

        .portal-header-titles .corp-name {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .portal-header-titles h1 {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-heading);
            letter-spacing: -0.01em;
            line-height: 1.3;
        }

        .portal-header-titles .zone-tag {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 3px;
        }

        .portal-body {
            padding: 28px;
        }

        .security-notice {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-subtle);
            border-left: 3px solid var(--accent-brand);
            padding: 12px 14px;
            border-radius: 4px;
            margin-bottom: 24px;
        }

        .security-notice .notice-title {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .security-notice p {
            font-size: 0.78rem;
            line-height: 1.45;
            color: #94a3b8;
        }

        .alert-error {
            background-color: var(--status-danger-bg);
            border: 1px solid var(--status-danger);
            color: #fca5a5;
            padding: 12px 14px;
            border-radius: 4px;
            font-size: 0.82rem;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            background-color: #0b1118;
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 11px 14px;
            font-family: var(--font-main);
            font-size: 0.92rem;
            color: var(--text-heading);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-brand);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2);
            background-color: #0d1520;
        }

        .form-input::placeholder {
            color: #475569;
        }

        .btn-authenticate {
            width: 100%;
            background-color: var(--accent-brand);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            color: #ffffff;
            padding: 12px 16px;
            font-family: var(--font-main);
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: background-color 0.15s ease;
            margin-top: 8px;
        }

        .btn-authenticate:hover {
            background-color: var(--accent-brand-hover);
        }

        .btn-authenticate:active {
            background-color: #02527d;
        }

        .portal-footer {
            background-color: #0d131b;
            border-top: 1px solid var(--border-subtle);
            padding: 16px 28px;
            font-size: 0.72rem;
            color: var(--text-muted);
            line-height: 1.5;
            text-align: center;
        }

        .system-meta {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            color: #556980;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div class="gateway-container">
        <div class="portal-card">
            <div class="portal-header">
                <div class="corp-emblem">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <div class="portal-header-titles">
                    <h1>Secure OT Access Gateway</h1>                    
                </div>
            </div>

            <div class="portal-body">

                {% if error %}
                <div class="alert-error">
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST" action="/login" autocomplete="off">
                    <div class="form-group">
                        <label for="username" class="form-label">Operator / Engineer ID</label>
                        <input type="text" id="username" name="username" class="form-input" placeholder="Enter corporate user identity" required autofocus>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Security Passcode</label>
                        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••••••" required>
                    </div>

                    <button type="submit" class="btn-authenticate">
                        Authenticate Identity
                    </button>
                </form>
            </div>

            <div class="portal-footer">
                <div>National Refining Corp &copy; 2026. All rights reserved.</div>
            </div>
        </div>
    </div>
</body>
</html>
