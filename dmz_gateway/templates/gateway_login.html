<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARABCO — Sign In</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23064e3b' stroke='%2310b981' stroke-width='1.5'/%3E%3Cpath d='M16 5l6.5 6.5a9.2 9.2 0 1 1-13 0L16 5z' fill='none' stroke='%23ecfdf5' stroke-width='2' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='18' r='3' fill='none' stroke='%2334d399' stroke-width='2'/%3E%3Cpath d='M16 12.5v2.5M16 21v2.5M10.5 18H13M19 18h2.5' stroke='%2334d399' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #070c09;
            --surface: #0f1712;
            --surface-elevated: #14201a;
            --border-subtle: #1b2e24;
            --border-active: #2b4c3c;
            --text-heading: #f0fdf4;
            --text-body: #d1fae5;
            --text-muted: #7da392;
            --accent-brand: #059669;
            --accent-brand-hover: #10b981;
            --status-danger: #ef4444;
            --status-danger-bg: rgba(239, 68, 68, 0.1);
            --font-main: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-base);
            color: var(--text-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            -webkit-font-smoothing: antialiased;
        }

        .gateway-container {
            width: 100%;
            max-width: 400px;
        }

        .portal-card {
            background-color: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.55), 0 0 40px rgba(5, 150, 105, 0.08);
            overflow: hidden;
        }

        .portal-header {
            padding: 36px 32px 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: linear-gradient(135deg, #064e3b 0%, #047857 100%);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #ecfdf5;
            box-shadow: 0 4px 16px rgba(5, 150, 105, 0.25);
        }

        .brand-logo svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-title {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: var(--text-heading);
            text-transform: uppercase;
        }

        .portal-body {
            padding: 8px 32px 36px;
        }

        .alert-error {
            background-color: var(--status-danger-bg);
            border: 1px solid var(--status-danger);
            color: #fca5a5;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            line-height: 1.4;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            background-color: #080d0a;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 12px 16px;
            font-family: var(--font-main);
            font-size: 0.95rem;
            color: var(--text-heading);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-brand);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.2);
            background-color: #0b130e;
        }

        .btn-authenticate {
            width: 100%;
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 8px;
            color: #ffffff;
            padding: 13px 16px;
            font-family: var(--font-main);
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: all 0.15s ease;
            margin-top: 6px;
            box-shadow: 0 4px 14px rgba(5, 150, 105, 0.25);
        }

        .btn-authenticate:hover {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35);
            transform: translateY(-1px);
        }

        .btn-authenticate:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="gateway-container">
        <div class="portal-card">
            <div class="portal-header">
                <div class="brand-logo">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                        <circle cx="12" cy="14" r="2.5"></circle>
                        <path d="M12 9v2.5M12 16.5V19M7 14h2.5M14.5 14H17"></path>
                    </svg>
                </div>
                <h1 class="brand-title">ARABCO</h1>
            </div>

            <div class="portal-body">
                {% if error %}
                <div class="alert-error">
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST" action="/login" autocomplete="off">
                    <div class="form-group">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" name="username" class="form-input" placeholder="Username" required autofocus>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-input" placeholder="Password" required>
                    </div>

                    <button type="submit" class="btn-authenticate">
                        Sign In
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
