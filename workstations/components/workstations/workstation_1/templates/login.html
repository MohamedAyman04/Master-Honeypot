    <style>
        :root {
            --bg-base: #070c09;
            --surface: #0f1712;
            --surface-elevated: #14201a;
            --border-subtle: #1b2e24;
            --border-active: #2b4c3c;
            --text-heading: #f0fdf4;
            --text-body: #d1fae5;
            --text-muted: #7da392;
            --accent-brand: #059669;
            --accent-brand-hover: #10b981;
            --status-danger: #ef4444;
            --status-danger-bg: rgba(239, 68, 68, 0.1);
            --font-main: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-base);
            color: var(--text-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            -webkit-font-smoothing: antialiased;
        }

        .gateway-container {
            width: 100%;
            max-width: 440px;
        }

        .portal-card {
            background-color: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65), 0 0 40px rgba(5, 150, 105, 0.1);
            overflow: hidden;
        }

        .portal-header {
            padding: 36px 32px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 12px;
            background: rgba(16, 185, 129, 0.06);
            padding: 3px;
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #ecfdf5;
            box-shadow: 0 4px 18px rgba(5, 150, 105, 0.3);
        }

        .brand-logo svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-title {
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: var(--text-heading);
            text-transform: uppercase;
        }

        .brand-badge {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            font-weight: 600;
            color: #10b981;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 4px 10px;
            border-radius: 999px;
            text-transform: uppercase;
        }

        .portal-body {
            padding: 28px 32px 36px;
        }

        .alert-error {
            background-color: var(--status-danger-bg);
            border: 1px solid var(--status-danger);
            color: #fca5a5;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            line-height: 1.4;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .form-input {
            width: 100%;
            background-color: #080d0a;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 12px 16px;
            font-family: var(--font-main);
            font-size: 0.95rem;
            color: var(--text-heading);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-brand);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.2);
            background-color: #0b130e;
        }

        .btn-authenticate {
            width: 100%;
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 8px;
            color: #ffffff;
            padding: 13px 16px;
            font-family: var(--font-main);
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            cursor: pointer;
            transition: all 0.15s ease;
            margin-top: 8px;
            box-shadow: 0 4px 14px rgba(5, 150, 105, 0.25);
        }

        .btn-authenticate:hover {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35);
            transform: translateY(-1px);
        }

        .btn-authenticate:active {
            transform: translateY(0);
        }

        .portal-footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border-subtle);
            text-align: center;
        }

        .footnote {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .security-banner {
            margin-top: 20px;
            text-align: center;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: #4b6657;
            letter-spacing: 0.03em;
        }
    </style>
</head>
<body>
    <div class="gateway-container">

                <h1 class="brand-title">ARABCO</h1>
                <span class="brand-badge">Level 3 SCADA Workstation Access</span>
            </div>

            <div class="portal-body">
                {% if error %}
                <div class="alert-error">
                    {{ error }}
                </div>
                {% endif %}

                <form id="login-form" method="POST" action="/login" autocomplete="off">
                    <div class="form-group">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" name="username" class="form-input" placeholder="Operator / Engineer ID" required autofocus>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-input" placeholder="Workstation PIN / Credential" required>
                    </div>

                    <button type="submit" class="btn-authenticate">
                        Authenticate Workstation
                    </button>
                </form>

                <div class="portal-footer">
                    <p class="footnote">Default users: admin/admin, operator/operator123, engineer/engineer456</p>
                </div>
            </div>
        </div>

        <div class="security-banner">
            CLASSIFICATION: RESTRICTED // ARABCO REFINING OPERATIONS
        </div>
    </div>

    <script>
        function trackActivity(event, target, destination) {
            const payload = {
                event,
                target,
                path: window.location.pathname,
                destination: destination || 'NONE'
            };

            fetch('/activity', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                keepalive: true
            }).catch(() => {});
        }

        document.getElementById('login-form').addEventListener('submit', function () {
            trackActivity('FORM_SUBMIT', 'login-form', '/login');
        });
    </script>
</body>
</html>
